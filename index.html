<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
  <div class="side-content">

    <div class="nav-item-dashboard" >
      <img class="nav-icon" src="/images/view-dashboard.svg" alt="dashboard" style="width: 40px; height: 40px;">
      <span style="font-size: 1.5em;">Dashboard</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/home.svg" alt="Home">
      <span>Home</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/card-account-details.svg" alt="Profile">
      <span>Profile</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/message-reply.svg" alt="Messages">
      <span>Messages</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/clock-time-three.svg" alt="History">
      <span>History</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/file-document-multiple.svg" alt="tasks">
      <span>Tasks</span>
    </div>

    <div class="nav-item" style="margin-bottom: 55px;">
      <img class="nav-icon" src="/images/account-group.svg" alt="communities">
      <span>Communities</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/cog.svg" alt="settings">
      <span>Settings</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/help-box.svg" alt="support">
      <span>Support</span>
    </div>

    <div class="nav-item">
      <img class="nav-icon" src="/images/shield-check.svg" alt="privacy">
      <span>Privacy</span>
    </div>

  </div>
</div>

    <div class="header">Header</div>
    <div class="main-content">Main Content</div>
  </div>

</html>
